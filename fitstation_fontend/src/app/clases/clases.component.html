<div class="clases-container">
  <header class="header-clases">
    <button routerLink="/dashboard" class="btn-back">← Volver</button>
    <h1>Clases Colectivas disponibles</h1>
    <p>Selecciona tu actividad, elige el horario y escoge una de las fechas disponibles para las próximas 2 semanas.</p>
  </header>

  <div class="grid-clases" *ngIf="clasesAgrupadas.length > 0">
    <div class="card-clase" *ngFor="let grupo of clasesAgrupadas">
      
      <div class="card-body">
        <h2>{{ grupo.name }}</h2>
        <p class="desc">{{ grupo.description }}</p>
        
        <div class="select-box" style="margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 0.85rem; color: #888; font-weight: 600;">⏱️ 1. Elige el horario disponible:</label>
          <select 
            [(ngModel)]="horariosSeleccionados[grupo.name]"
            (change)="onHorarioChange(grupo.name, grupo)"
            style="background: #161616; border: 1px solid #333; color: white; padding: 11px; border-radius: 8px; font-family: inherit; font-size: 0.9rem; outline: none; cursor: pointer; transition: 0.2s;"
            onfocus="this.style.borderColor='#2ecc71'"
            onblur="this.style.borderColor='#333'"
          >
            <option *ngFor="let h of grupo.horarios" [value]="h.idClass">
              {{ h.dayOfWeek === 'Monday' ? 'Lunes' : h.dayOfWeek === 'Wednesday' ? 'Miércoles' : h.dayOfWeek }} a las {{ h.classTime }} — Prof: {{ h.trainerName }}
            </option>
          </select>
        </div>

        <div class="select-box" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
          <label style="font-size: 0.85rem; color: #888; font-weight: 600;">📅 2. Selecciona el día para asistir:</label>
          <select 
            [(ngModel)]="fechasSeleccionadas[grupo.name]"
            style="background: #161616; border: 1px solid #333; color: white; padding: 11px; border-radius: 8px; font-family: inherit; font-size: 0.9rem; outline: none; cursor: pointer; transition: 0.2s;"
            onfocus="this.style.borderColor='#2ecc71'"
            onblur="this.style.borderColor='#333'"
          >
            <option *ngFor="let fecha of getFechasDisponibles(grupo)" [value]="fecha">
              {{ formatearFechaEspanol(fecha) }}
            </option>
          </select>
        </div>
      </div>

      <button class="btn-book" (click)="reservar(grupo.name)">
        RESERVAR PLAZA
      </button>
    </div>
  </div>

  <div class="no-clases" *ngIf="clasesAgrupadas.length === 0">
    <p>Sincronizando actividades disponibles en FitStation...</p>
  </div>
</div>
